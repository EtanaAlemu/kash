name: kash
description: Offline-first, self-custodial expense tracker.
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  drift: ^2.26.1
  sqlite3: ^2.4.6
  sqlcipher_flutter_libs: ^0.6.0
  flutter_secure_storage: ^9.2.4
  fl_chart: ^0.70.2
  path_provider: ^2.1.6
  path: ^1.9.1
  crypto: ^3.0.6
  intl: ^0.20.2
  local_auth: ^2.3.0
  uuid: ^4.5.1
  collection: ^1.19.1
  file_picker: ^8.1.7
  pointycastle: ^3.9.1
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  firebase_core: ^4.15.0
  firebase_crashlytics: ^5.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.26.1
  build_runner: ^2.4.14
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#0B1A2E"
  adaptive_icon_foreground: assets/icon/app_icon.png
  remove_alpha_ios: true
  macos:
    generate: true
    image_path: assets/icon/app_icon.png

flutter:
  uses-material-design: true
